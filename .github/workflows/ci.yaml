# Phase 0 CI: header, style, and DCO checks. Grows per phase, always
# hardware-free (docs/plans/engineering-conventions.md, section 4).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License headers
        run: sh hack/check-headers.sh
      - name: Writing style rules
        run: sh hack/check-style.sh
      - name: Manifest security gate
        run: sh hack/check-manifests.sh
      - name: Transmit interlock gate
        run: sh hack/check-transmit.sh
      - name: ShellCheck the gate scripts
        run: shellcheck hack/*.sh

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kpt
        run: |
          curl -sL "https://github.com/kptdev/kpt/releases/download/v1.0.0-beta.67/kpt_linux_amd64-1.0.0-beta.67.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kpt
          kpt version
      - name: Render all kpt packages
        run: sh hack/check-packages.sh

  dco:
    # Dependabot commits carry no Signed-off-by; its PRs are exempt.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: All commits signed off
        run: |
          missing=0
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "commit $sha lacks Signed-off-by"
              missing=1
            fi
          done
          exit $missing
