# Phase 0 CI: header, style, and DCO checks. Grows per phase, always
# hardware-free (docs/plans/engineering-conventions.md, section 4).

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the checked-out code. The
# default GITHUB_TOKEN can be broader, so scope it down to limit blast radius.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: License headers
        run: sh hack/check-headers.sh
      - name: Writing style rules
        run: sh hack/check-style.sh
      - name: Manifest security gate
        run: sh hack/check-manifests.sh
      - name: Transmit interlock gate
        run: sh hack/check-transmit.sh
      - name: Actions are SHA-pinned
        run: sh hack/check-actions.sh
      - name: No default credentials in shipped manifests
        run: sh hack/check-secrets.sh
      - name: No lab identity in the tree
        run: sh hack/check-lab-identity.sh
      - name: DCO contribution-range controls
        run: sh hack/test-check-dco.sh
      - name: ShellCheck the gate scripts
        run: shellcheck hack/*.sh

  packages:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kpt (checksum-verified)
        # Verify the download before trusting it, rather than piping curl
        # straight into sudo tar. Bump KPT_VERSION and KPT_SHA256 together;
        # the checksum comes from the release's checksums.txt.
        env:
          KPT_VERSION: v1.0.0-beta.67
          KPT_SHA256: 5769ef31efb5a18a1b94e1e766443c685aabd72f9f52bfc83079e1f4b1c3d532
        run: |
          curl -sSL -o kpt.tar.gz \
            "https://github.com/kptdev/kpt/releases/download/${KPT_VERSION}/kpt_linux_amd64-${KPT_VERSION#v}.tar.gz"
          echo "${KPT_SHA256}  kpt.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f kpt.tar.gz kpt
          rm -f kpt.tar.gz
          kpt version
      - name: Render all kpt packages
        run: sh hack/check-packages.sh
      - name: Reject an invalid kpt package
        run: sh hack/test-check-packages.sh
      - name: Validate specialization examples against the released Porch CRDs
        run: |
          work=$(mktemp -d)
          curl -fsSL --retry 3 -o "$work/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSL --retry 3 -o "$work/porch.tar.gz" https://github.com/kptdev/porch/releases/download/v1.6.2/porch-kpt-package.tar.gz
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $work/kind" | sha256sum -c -
          echo "94925edebef145bb45dca5be361adf4eb219c4dcd22725922072a6ed20bf17cd  $work/porch.tar.gz" | sha256sum -c -
          chmod +x "$work/kind"
          tar -xzf "$work/porch.tar.gz" -C "$work" 0-packagevariants.yaml 0-packagevariantsets.yaml
          export KUBECONFIG="$work/kubeconfig"
          "$work/kind" create cluster --name porch-schema --wait 2m
          kubectl apply -f "$work/0-packagevariants.yaml" -f "$work/0-packagevariantsets.yaml"
          kubectl wait --for=condition=Established crd/packagevariants.config.porch.kpt.dev crd/packagevariantsets.config.porch.kpt.dev
          kubectl apply --dry-run=server --validate=strict -f packages/examples/

  dco:
    # Dependabot commits carry no Signed-off-by; its PRs are exempt.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: All commits signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh hack/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
