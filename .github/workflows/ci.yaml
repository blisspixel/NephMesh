# Phase 0 CI: header, style, and DCO checks. Grows per phase, always
# hardware-free (docs/plans/engineering-conventions.md, section 4).

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the checked-out code. The
# default GITHUB_TOKEN can be broader, so scope it down to limit blast radius.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: License headers
        run: sh hack/check-headers.sh
      - name: Writing style rules
        run: sh hack/check-style.sh
      - name: Manifest security gate
        run: sh hack/check-manifests.sh
      - name: Transmit interlock gate
        run: sh hack/check-transmit.sh
      - name: Actions are SHA-pinned
        run: sh hack/check-actions.sh
      - name: ShellCheck the gate scripts
        run: shellcheck hack/*.sh

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kpt (checksum-verified)
        # Verify the download before trusting it, rather than piping curl
        # straight into sudo tar. Bump KPT_VERSION and KPT_SHA256 together;
        # the checksum comes from the release's checksums.txt.
        env:
          KPT_VERSION: v1.0.0-beta.67
          KPT_SHA256: 5769ef31efb5a18a1b94e1e766443c685aabd72f9f52bfc83079e1f4b1c3d532
        run: |
          curl -sSL -o kpt.tar.gz \
            "https://github.com/kptdev/kpt/releases/download/${KPT_VERSION}/kpt_linux_amd64-${KPT_VERSION#v}.tar.gz"
          echo "${KPT_SHA256}  kpt.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f kpt.tar.gz kpt
          rm -f kpt.tar.gz
          kpt version
      - name: Render all kpt packages
        run: sh hack/check-packages.sh

  dco:
    # Dependabot commits carry no Signed-off-by; its PRs are exempt.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: All commits signed off
        run: |
          missing=0
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "commit $sha lacks Signed-off-by"
              missing=1
            fi
          done
          exit $missing
