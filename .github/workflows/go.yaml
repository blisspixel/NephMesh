# Go build, vet, test, and generated-artifact freshness for every Go module.
# Hardware-free by construction: the api module is pure types.

name: go

on:
  push:
    branches: [main]
    paths: ["api/**", "operators/**", ".github/workflows/go.yaml"]
  pull_request:
    paths: ["api/**", "operators/**", ".github/workflows/go.yaml"]

# Least privilege: these jobs only read the checked-out code. The default
# GITHUB_TOKEN can be broader, so scope it down to limit blast radius.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with the race detector
        run: go test -race ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: api
      - name: Coverage gate
        run: sh ../hack/check-coverage.sh 80
      - name: Generated artifacts are up to date
        run: make verify

  meshtastic-operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operators/meshtastic-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with the race detector
        run: go test -race ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: operators/meshtastic-operator
      - name: Coverage gate
        run: sh ../../hack/check-coverage.sh 80

  integration:
    # Drives the real reconcile loop against a live meshtasticd --sim, so the
    # operator is validated against real firmware, not just the fake. Needs
    # Docker and the Meshtastic CLI; runs only on the operator module's changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the Meshtastic CLI
        run: pip install "meshtastic[cli]==2.7.11"
      - name: Start meshtasticd --sim
        run: |
          docker run -d --name simdev --restart=always -p 14403:4403 \
            meshtastic/meshtasticd:beta-debian \
            meshtasticd --sim --fsdir=/var/lib/meshtasticd --port=4403
          for i in $(seq 1 30); do
            if python -c "import socket; socket.create_connection(('127.0.0.1',14403),timeout=3).close()" 2>/dev/null; then
              echo "device reachable"; break
            fi
            sleep 2
          done
      - name: Integration test against the sim device
        working-directory: operators/meshtastic-operator
        env:
          MESH_TEST_HOST: 127.0.0.1:14403
        run: go test -tags integration ./internal/reconcile -run Integration -v

  envtest:
    # The controller tier against a real API server and etcd: proves the CRD's
    # CEL and OpenAPI validations reject hostile resources at admission, and the
    # reconciler's finalizer and idempotency behavior, which the fake client
    # cannot reproduce. setup-envtest provisions the control-plane binaries.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operators/meshtastic-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - name: Provision envtest binaries
        # setup-envtest is built with a newer Go than this module targets, so
        # let the toolchain float for the tool install only; the test build
        # still runs on 1.25.12.
        run: |
          GOTOOLCHAIN=auto go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          SETUP_ENVTEST="$(go env GOPATH)/bin/setup-envtest"
          echo "KUBEBUILDER_ASSETS=$("$SETUP_ENVTEST" use -p path)" >> "$GITHUB_ENV"
      - name: Controller envtest suite
        run: go test -tags envtest ./internal/controller/ -v
