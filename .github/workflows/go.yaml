# Go build, vet, test, and generated-artifact freshness for every Go module.
# Hardware-free by construction: the api module is pure types.

name: go

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/go.yaml"]
  pull_request:
    paths: ["api/**", ".github/workflows/go.yaml"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -cover
      - name: Generated artifacts are up to date
        run: make verify
