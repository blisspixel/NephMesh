name: operator image

on:
  pull_request:
    paths:
      - "api/**"
      - "operators/meshtastic-operator/**"
      - "hack/check-operator-image.sh"
      - ".github/workflows/operator-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.1
          driver-opts: image=moby/buildkit@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install registry client
        run: &install-regctl |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/regctl" \
            https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64
          echo "3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  $RUNNER_TEMP/regctl" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/registry-bin"
          install -m 0755 "$RUNNER_TEMP/regctl" "$RUNNER_TEMP/registry-bin/regctl"
          echo "$RUNNER_TEMP/registry-bin" >> "$GITHUB_PATH"
      - name: Lint operator Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 \
            < operators/meshtastic-operator/Dockerfile
      - name: Build both platforms with SPDX and SLSA attestations
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance=mode=max \
            --sbom=generator=docker/buildkit-syft-scanner@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315 \
            --metadata-file "$RUNNER_TEMP/candidate/metadata.json" \
            --output "type=oci,dest=$RUNNER_TEMP/candidate/operator.tar" \
            -f operators/meshtastic-operator/Dockerfile .
      - name: Exercise and scan the release archive
        run: |
          python -m pip install "pip-audit==2.10.1"
          sh hack/check-operator-image.sh "$RUNNER_TEMP/candidate/operator.tar"
      - name: Retain the checked archive for publication
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-oci
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-image:
    needs: check-image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operator-oci
          path: candidate
      - name: Install registry client
        run: *install-regctl
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6
      - name: Publish and sign the checked index
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nephmesh-meshtastic-operator"
          digest=$(jq -er '."containerimage.digest"' candidate/metadata.json)
          regctl image import "$image:sha-$GITHUB_SHA" candidate/operator.tar
          test "$(regctl image digest "$image:sha-$GITHUB_SHA")" = "$digest"
          ref="$image@$digest"
          cosign sign --yes "$ref"
          cosign verify --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref"
          cosign sign-blob --yes --bundle operator.sigstore.json candidate/operator.tar
          cosign verify-blob --bundle operator.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com candidate/operator.tar
          echo "Verified operator image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-signature
          path: operator.sigstore.json
          retention-days: 7
