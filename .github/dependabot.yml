# Keeps dependencies current with minimal churn. Grouped so a week's
# patch and minor bumps arrive as one reviewable PR per ecosystem, not
# a swarm. Every update still runs the full CI gates before it can land.
# Dependabot commits carry no DCO sign-off, so the dco gate exempts the
# bot actor (see .github/workflows/ci.yaml).
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /api
      - /operators/meshtastic-operator
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    # The Kubernetes libraries move the go directive forward (k8s v0.36
    # requires go 1.26), which reintroduces the stdlib-vulnerability versus
    # toolchain churn the 1.25.12 pin avoids and needs a tested migration.
    # Take only their patch releases automatically; the framework major and
    # minor jumps are a deliberate, tracked upgrade, not an auto-merge.
    ignore:
      - dependency-name: k8s.io/*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: sigs.k8s.io/controller-runtime
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /operators/meshtastic-operator
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
