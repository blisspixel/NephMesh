---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - intent.nephmesh.io
  resources:
  - communicationintents
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - intent.nephmesh.io
  resources:
  - communicationintents/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - mesh.nephmesh.io
  resources:
  - meshtasticnodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mesh.nephmesh.io
  resources:
  - meshtasticnodes/finalizers
  verbs:
  - update
- apiGroups:
  - mesh.nephmesh.io
  resources:
  - meshtasticnodes/status
  verbs:
  - get
  - patch
  - update
