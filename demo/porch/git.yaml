apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: site-git
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git
  template:
    metadata:
      labels:
        app: git
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gitea
          image: gitea/gitea:1.26-rootless@sha256:cd1d2614b403fc9b085fa52ceb4424dde9c4dcf5da8e3263abb27955562070c4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
          readinessProbe:
            httpGet: {path: /api/healthz, port: 3000}
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: site-git
---
apiVersion: v1
kind: Service
metadata:
  name: git
spec:
  selector:
    app: git
  ports:
    - {name: http, port: 3000, targetPort: 3000}
