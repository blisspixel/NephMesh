# Private in-cluster broker (the public mqtt.meshtastic.org is heavily
# restricted and unsuitable). Uses the image's built-in no-auth config,
# which is demo-only by design: the broker is cluster-internal and holds
# no secrets. Real deployments get credentials in a later phase.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: nephmesh
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: nephmesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/part-of: nephmesh
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mqtt
              containerPort: 1883
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: nephmesh
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
