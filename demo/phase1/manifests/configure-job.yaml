# One-shot declarative config apply. A Job rather than an init container
# because nothing listens on 4403 before the meshtasticd container starts.
# pip needs egress; a prebuilt CLI image is the documented offline
# fallback (docs/plans/phase-1-virtual-mesh.md, open decision 3).

apiVersion: batch/v1
kind: Job
metadata:
  name: meshnode-configure
  namespace: nephmesh
  labels:
    app.kubernetes.io/name: meshnode-configure
    app.kubernetes.io/part-of: nephmesh
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meshnode-configure
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: python:3.13-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --quiet "meshtastic[cli]" PyYAML
              python /config/apply.py
          env:
            - name: MESH_HOST
              value: meshnode-sim.nephmesh.svc.cluster.local
            - name: MQTT_SERVICE
              value: mosquitto.nephmesh.svc.cluster.local
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: desired
              mountPath: /config
      volumes:
        - name: desired
          configMap:
            name: meshnode-desired-state
