# Validated against meshtastic/meshtasticd:beta-debian (firmware 2.7.26):
# - The image has no entrypoint; its default cmd wraps meshtasticd in a
#   shell, so we set an explicit command.
# - Persistence root is --fsdir; prefs land at <fsdir>/prefs/. The PVC
#   therefore mounts at /var/lib/meshtasticd.
# - --hwid=dc2c6e000001 deterministically yields MAC dc:2c:6e:00:00:01 and
#   node ID !6e000001.
# - Applying config makes the process exit (the device "reboot"); the
#   Deployment's restart policy brings it back. This is normal, not a crash
#   loop, and the config Job tolerates it.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meshnode-portduino
  namespace: nephmesh
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshnode-sim
  namespace: nephmesh
  labels:
    app.kubernetes.io/name: meshnode-sim
    app.kubernetes.io/part-of: nephmesh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meshnode-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meshnode-sim
        app.kubernetes.io/part-of: nephmesh
    spec:
      containers:
        - name: meshtasticd
          image: meshtastic/meshtasticd:beta-debian
          command: ["meshtasticd"]
          args:
            - --sim
            - --fsdir=/var/lib/meshtasticd
            - --hwid=dc2c6e000001
            - --port=4403
          ports:
            - name: device-api
              containerPort: 4403
          # Deliberately no TCP readiness probe: the device API is
          # single-client and every probe connection force-closes the
          # active CLI session, which can interrupt a config apply in
          # progress. The applier Job does its own reachability waits.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: portduino
              mountPath: /var/lib/meshtasticd
      volumes:
        - name: portduino
          persistentVolumeClaim:
            claimName: meshnode-portduino
---
apiVersion: v1
kind: Service
metadata:
  name: meshnode-sim
  namespace: nephmesh
spec:
  selector:
    app.kubernetes.io/name: meshnode-sim
  ports:
    - name: device-api
      port: 4403
      targetPort: device-api
