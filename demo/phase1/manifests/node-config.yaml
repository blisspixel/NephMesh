# Desired node state in the Meshtastic CLI --export-config / --configure
# YAML format, plus the applier script. Validated notes:
# - The __MQTT_ADDRESS__ placeholder is replaced with the resolved broker
#   IP at apply time: in the Docker rehearsal the device's MQTT client did
#   not connect when given a hostname, but connected immediately with an
#   IP. A Service ClusterIP is stable for the Service's lifetime.
# - JSON topics are enabled purely for demo readability; the protobuf
#   msh/2/e/... topics are canonical (topic prefix observed on firmware
#   2.7.26; the region segment documented elsewhere as msh/US/... was not
#   present).
# - Channel PSKs would be Secrets, never ConfigMaps; this demo uses only
#   the default channel and carries no secret material.

apiVersion: v1
kind: ConfigMap
metadata:
  name: meshnode-desired-state
  namespace: nephmesh
data:
  node.yaml: |
    config:
      lora:
        region: US
    module_config:
      mqtt:
        enabled: true
        address: __MQTT_ADDRESS__
        json_enabled: true
  apply.py: |
    # Copyright 2026 The NephMesh Authors.
    # Licensed under the Apache License, Version 2.0. See the repository
    # LICENSE file; header abbreviated here to keep the ConfigMap readable.
    #
    # Declarative config applier: export live state, compare the desired
    # subset, apply only on drift, verify after the device's post-apply
    # reboot. This one-shot Job is the seed of the Phase 4 operator loop.
    import os
    import socket
    import subprocess
    import sys
    import time

    import yaml

    HOST = os.environ["MESH_HOST"]
    MQTT_SERVICE = os.environ["MQTT_SERVICE"]

    def wait_reachable(timeout=180):
        deadline = time.time() + timeout
        while time.time() < deadline:
            try:
                with socket.create_connection((HOST, 4403), timeout=5):
                    return
            except OSError:
                time.sleep(3)
        sys.exit(f"device API {HOST}:4403 not reachable in {timeout}s")

    def cli(*args, tolerate_failure=False):
        cmd = ["meshtastic", "--host", HOST, *args]
        proc = subprocess.run(cmd, capture_output=True, text=True, timeout=180)
        if proc.returncode != 0 and not tolerate_failure:
            sys.exit(f"{' '.join(cmd)} failed:\n{proc.stdout}\n{proc.stderr}")
        return proc.stdout

    def export_live():
        out = cli("--export-config")
        start = out.find("# start of Meshtastic configure yaml")
        return yaml.safe_load(out[start:] if start >= 0 else out)

    def norm_key(k):
        # The CLI accepts snake_case keys on --configure but exports
        # camelCase (json_enabled in, jsonEnabled out), so keys compare
        # case- and underscore-insensitively.
        return str(k).lower().replace("_", "")

    def is_subset(desired, live):
        if isinstance(desired, dict):
            if not isinstance(live, dict):
                return False
            live_n = {norm_key(k): v for k, v in live.items()}
            return all(
                norm_key(k) == "password"
                or (norm_key(k) in live_n and is_subset(v, live_n[norm_key(k)]))
                for k, v in desired.items()
            )
        # Values are case-sensitive (an MQTT root topic is). Keys already folded.
        return str(desired).strip() == str(live).strip()

    def main():
        broker_ip = socket.gethostbyname(MQTT_SERVICE)
        with open("/config/node.yaml") as f:
            desired = yaml.safe_load(f.read().replace("__MQTT_ADDRESS__", broker_ip))

        wait_reachable()
        if is_subset(desired, export_live() or {}):
            print("already converged; no changes, no reboot")
            return

        rendered = os.path.join(os.environ.get("HOME", "/tmp"), "node-rendered.yaml")
        with open(rendered, "w") as f:
            yaml.safe_dump(desired, f)

        # The CLI may lose its session mid-apply if the device restarts,
        # so failures here are tolerated and the outcome is judged by the
        # post-reboot verify below.
        print("applying configuration")
        cli("--configure", rendered, tolerate_failure=True)
        time.sleep(10)
        wait_reachable()
        print("enabling MQTT uplink on the primary channel")
        cli("--ch-set", "uplink_enabled", "true", "--ch-index", "0",
            tolerate_failure=True)
        time.sleep(10)
        wait_reachable()
        # The MQTT client thread only starts at boot (an in-place config
        # write does not start it), so an explicit reboot makes the
        # outcome deterministic regardless of whether the applies above
        # already restarted the device.
        print("rebooting device to activate module config")
        cli("--reboot", tolerate_failure=True)
        time.sleep(15)
        wait_reachable()

        if is_subset(desired, export_live() or {}):
            print("configuration verified after apply")
        else:
            sys.exit("post-apply verification failed: live config does not match desired state")

    if __name__ == "__main__":
        main()
