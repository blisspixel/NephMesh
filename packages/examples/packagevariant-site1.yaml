# Clone the mesh-gateway blueprint into one site's deployment repo. Porch
# creates a draft PackageRevision in the downstream repo; a human approves it
# (see the propose/approve flow in docs/guides/porch-registration.md) before
# it is pushed to the site cluster. Replace repository names to match your
# registered repositories (porchctl repo get -A).
apiVersion: config.porch.kpt.dev/v1alpha1
kind: PackageVariant
metadata:
  name: mesh-gateway-site1
spec:
  upstream:
    repo: nephmesh-catalog
    package: mesh-gateway
    revision: v1
  downstream:
    repo: site1-deployments
    package: mesh-gateway
  # Rename the downstream package context so set-namespace places this site's
  # gateway into its own namespace.
  packageContext:
    data:
      name: site1-mesh-gateway
