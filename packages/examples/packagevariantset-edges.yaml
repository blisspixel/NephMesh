# Fan the mesh-gateway blueprint out to every workload cluster labelled as a
# mesh edge, one specialized package per cluster. This is the mechanism by
# which a single intent ("every mesh edge runs a gateway") becomes many
# per-site deployments. The objectSelector matches Nephio WorkloadCluster
# objects on the management cluster; the injectors bring each cluster's
# WorkloadCluster into its cloned package, replacing the placeholder, so
# future specializer functions see real site context.
apiVersion: config.porch.kpt.dev/v1alpha2
kind: PackageVariantSet
metadata:
  name: mesh-gateway-edges
spec:
  upstream:
    repo: nephmesh-catalog
    package: mesh-gateway
    revision: v1
  targets:
    - objectSelector:
        apiVersion: infra.nephio.org/v1alpha1
        kind: WorkloadCluster
        matchLabels:
          nephmesh.io/site-type: mesh-edge
      template:
        downstream:
          packageExpr: "'mesh-gateway'"
          repoExpr: "target.name + '-deployments'"
        packageContext:
          data:
            - key: name
              valueExpr: "target.name + '-mesh-gateway'"
        injectors:
          - apiVersion: infra.nephio.org/v1alpha1
            kind: WorkloadCluster
            nameExpr: target.name
