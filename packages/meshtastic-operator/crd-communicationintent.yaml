---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: communicationintents.intent.nephmesh.io
spec:
  group: intent.nephmesh.io
  names:
    kind: CommunicationIntent
    listKind: CommunicationIntentList
    plural: communicationintents
    singular: communicationintent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.selectedModemPreset
      name: Preset
      type: string
    - jsonPath: .status.nodeCount
      name: Nodes
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Feasible")].status
      name: Feasible
      type: string
    - jsonPath: .status.predictedChannelUtilizationPercent
      name: Airtime%
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CommunicationIntent is outcome-level mesh communications intent that compiles to
          MeshtasticNode specs. It is report-only today: the operator writes the proposed
          rendering and a feasibility verdict to status and never actuates (ADR 0001).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CommunicationIntentSpec declares desired mesh communications at an outcome
              level, above per-device configuration. A compiler renders it into the concrete
              MeshtasticNode specs that satisfy it. Today the compiler runs report-only: the
              rendering and a feasibility verdict are written to status and nothing is
              created or written to a device.
            properties:
              approvedModemPresets:
                description: |-
                  approvedModemPresets is the set of modem presets a rendered node may run.
                  The compiler selects from this set (the first entry is preferred); an empty
                  set is infeasible. This is the "approved operating set" from the doctrine:
                  the strategic layer owns the allowed set, a lower layer the selection.
                items:
                  type: string
                maxItems: 16
                minItems: 1
                type: array
              channels:
                description: |-
                  channels are the channels every rendered node carries (PSKs referenced from
                  Secrets, never inlined), the same shape a MeshtasticNode declares. Keyed by
                  index so a duplicate channel index is rejected at admission. Meshtastic
                  supports up to 8 channels.
                items:
                  description: ChannelSpec is one Meshtastic channel.
                  properties:
                    downlinkEnabled:
                      description: downlinkEnabled injects MQTT traffic onto this
                        channel.
                      type: boolean
                    index:
                      description: index is the channel slot; 0 is the primary channel.
                      format: int32
                      maximum: 7
                      minimum: 0
                      type: integer
                    name:
                      description: |-
                        name is the channel name. The device stores a short name (about 12 bytes)
                        and silently truncates a longer one, which would then never round-trip and
                        leave the node stuck re-applying, so it is bounded here to fail fast at
                        admission instead.
                      maxLength: 12
                      type: string
                    pskSecretRef:
                      description: |-
                        pskSecretRef references the channel pre-shared key. It is never inlined.
                        Omitting it uses the device default, which is discouraged because the
                        default PSK is public.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    uplinkEnabled:
                      description: uplinkEnabled forwards this channel's traffic to
                        MQTT.
                      type: boolean
                  required:
                  - index
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - index
                x-kubernetes-list-type: map
              expectedTraffic:
                description: |-
                  expectedTraffic optionally describes the offered application load the fleet
                  will generate, so the compiler can estimate whether the whole fleet fits the
                  channel's airtime budget. This is a fleet-wide check the per-node reconcile
                  cannot make: it sees one radio, never the shared channel. Omit it and airtime
                  is reported as not evaluated rather than guessed.
                properties:
                  messagesPerMinutePerNode:
                    description: |-
                      messagesPerMinutePerNode is the application messages each node originates per
                      minute. The estimate assumes every node offers this load.
                    maximum: 600
                    minimum: 1
                    type: integer
                  payloadBytes:
                    description: |-
                      payloadBytes is the representative application payload per message. It
                      defaults to a representative size when unset, and is capped at the
                      Meshtastic maximum payload.
                    maximum: 237
                    minimum: 1
                    type: integer
                required:
                - messagesPerMinutePerNode
                type: object
              nodes:
                description: |-
                  nodes are the target devices this intent renders to. Keyed by name so two
                  targets cannot share a name (they would render two colliding MeshtasticNode
                  specs); the collision is rejected at admission rather than surfaced later.
                  The bound keeps one intent to a reviewable fleet and, because each target
                  carries a Connection with a CEL rule, keeps the CRD within the apiserver's
                  validation cost budget; address a larger region with several intents.
                items:
                  description: NodeTarget names one device the intent applies to and
                    how to reach it.
                  properties:
                    connection:
                      description: connection is how to reach this device.
                      properties:
                        serial:
                          description: serial reaches the device over a serial port
                            exposed to the pod.
                          properties:
                            device:
                              description: |-
                                device is the serial device path, for example /dev/ttyUSB0 or COM3. The
                                pattern forbids a leading dash so the value cannot be misread as a CLI flag
                                when it reaches the device client's argv (the same guard host carries).
                              maxLength: 255
                              pattern: ^[a-zA-Z0-9/][a-zA-Z0-9/._-]*$
                              type: string
                          required:
                          - device
                          type: object
                        tcp:
                          description: tcp reaches the device over its TCP client
                            API (port 4403 by default).
                          properties:
                            host:
                              description: |-
                                host is the device address (a Service name, FQDN, IPv4, or IPv6). The
                                pattern forbids a leading dash so the value cannot be misread as a CLI
                                flag, and bounds the length.
                              maxLength: 253
                              pattern: ^[a-zA-Z0-9:]([a-zA-Z0-9.:_-]*[a-zA-Z0-9])?$
                              type: string
                            port:
                              default: 4403
                              description: port defaults to 4403.
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                          required:
                          - host
                          type: object
                        viaGateway:
                          description: |-
                            viaGateway manages a radio-only node remotely through a managed gateway
                            node, using the admin channel.
                          properties:
                            dest:
                              description: |-
                                dest is the target radio node id, for example "!6e000001": a "!" followed by
                                8 hex digits. The pattern both validates the id and forbids a leading dash,
                                so the value cannot be misread as a CLI flag when it reaches argv.
                              pattern: ^![0-9a-fA-F]{8}$
                              type: string
                            gatewayRef:
                              description: gatewayRef names another MeshtasticNode
                                that carries the admin channel.
                              properties:
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                          required:
                          - dest
                          - gatewayRef
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of tcp, serial, or viaGateway must be
                          set
                        rule: '[has(self.tcp), has(self.serial), has(self.viaGateway)].filter(x,
                          x).size() == 1'
                    name:
                      description: name is the MeshtasticNode name the rendering would
                        carry.
                      maxLength: 253
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    owner:
                      description: owner optionally sets this node's owner names.
                      properties:
                        longName:
                          description: longName is the full node name.
                          maxLength: 40
                          type: string
                        shortName:
                          description: shortName is limited to a few characters on
                            the device.
                          maxLength: 4
                          type: string
                      type: object
                  required:
                  - connection
                  - name
                  type: object
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              region:
                description: |-
                  region is the regulatory region every rendered node must use. It is a hard
