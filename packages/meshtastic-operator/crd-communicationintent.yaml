                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodeCount:
                description: nodeCount is how many nodes the intent renders to.
                type: integer
              observedGeneration:
                description: observedGeneration is the spec generation last compiled.
                format: int64
                type: integer
              predictedChannelUtilizationPercent:
                description: |-
                  predictedChannelUtilizationPercent is the fleet's estimated share of the
                  channel at the selected preset and declared traffic, a conservative floor
                  (rebroadcast ignored). It is set only when expectedTraffic is declared; the
                  AirtimeWithinBudget condition carries the verdict and caveats.
                type: integer
              proposedNodes:
                description: |-
                  proposedNodes is the rendered MeshtasticNode specs the intent compiles to.
                  Report-only: these are what the operator would create, not created. Bounded
                  to match spec.nodes (each rendered spec carries a Connection with a CEL
                  rule, so the bound also keeps the CRD within the validation cost budget).
                items:
                  description: |-
                    ProposedNode is one rendered MeshtasticNode the compiler would create. The Spec
                    is a MeshtasticNodeSpec directly: the compiled output IS the device-level
                    resource, per ADR 0001.
                  properties:
                    name:
                      type: string
                    spec:
                      description: |-
                        MeshtasticNodeSpec is the desired state of one Meshtastic node.

                        Fields mirror the real device configuration surface reachable over the
                        TCP 4403 client API. Enum-like fields (region, modemPreset, role) are open
                        strings with a shape pattern rather than closed enums, so a firmware update
                        that adds a value does not reject the API until the CRD is re-released; the
                        controller keeps known values as constants and degrades gracefully on
                        anything it does not recognize.
                      properties:
                        channels:
                          description: |-
                            channels is the desired channel set, by index. PSKs are referenced from
                            Secrets, never inlined.
                          items:
                            description: ChannelSpec is one Meshtastic channel.
                            properties:
                              downlinkEnabled:
                                description: downlinkEnabled injects MQTT traffic
                                  onto this channel.
                                type: boolean
                              index:
                                description: index is the channel slot; 0 is the primary
                                  channel.
                                format: int32
                                maximum: 7
                                minimum: 0
                                type: integer
                              name:
                                description: |-
                                  name is the channel name. The device stores a short name (about 12 bytes)
                                  and silently truncates a longer one, which would then never round-trip and
                                  leave the node stuck re-applying, so it is bounded here to fail fast at
                                  admission instead.
                                maxLength: 12
                                type: string
                              pskSecretRef:
                                description: |-
                                  pskSecretRef references the channel pre-shared key. It is never inlined.
                                  Omitting it uses the device default, which is discouraged because the
                                  default PSK is public.
                                properties:
                                  key:
                                    description: The key of the secret to select from.  Must
                                      be a valid secret key.
                                    type: string
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                  optional:
                                    description: Specify whether the Secret or its
                                      key must be defined
                                    type: boolean
                                required:
                                - key
                                type: object
                                x-kubernetes-map-type: atomic
                              uplinkEnabled:
                                description: uplinkEnabled forwards this channel's
                                  traffic to MQTT.
                                type: boolean
                            required:
                            - index
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - index
                          x-kubernetes-list-type: map
                        connection:
                          description: connection selects exactly one transport to
                            the device.
                          properties:
                            serial:
                              description: serial reaches the device over a serial
                                port exposed to the pod.
                              properties:
                                device:
                                  description: |-
                                    device is the serial device path, for example /dev/ttyUSB0 or COM3. The
                                    pattern forbids a leading dash so the value cannot be misread as a CLI flag
                                    when it reaches the device client's argv (the same guard host carries).
                                  maxLength: 255
                                  pattern: ^[a-zA-Z0-9/][a-zA-Z0-9/._-]*$
                                  type: string
                              required:
                              - device
                              type: object
                            tcp:
                              description: tcp reaches the device over its TCP client
                                API (port 4403 by default).
                              properties:
                                host:
                                  description: |-
                                    host is the device address (a Service name, FQDN, IPv4, or IPv6). The
                                    pattern forbids a leading dash so the value cannot be misread as a CLI
                                    flag, and bounds the length.
                                  maxLength: 253
                                  pattern: ^[a-zA-Z0-9:]([a-zA-Z0-9.:_-]*[a-zA-Z0-9])?$
                                  type: string
                                port:
                                  default: 4403
                                  description: port defaults to 4403.
                                  format: int32
                                  maximum: 65535
                                  minimum: 1
                                  type: integer
                              required:
                              - host
                              type: object
                            viaGateway:
                              description: |-
                                viaGateway manages a radio-only node remotely through a managed gateway
                                node, using the admin channel.
                              properties:
                                dest:
                                  description: |-
                                    dest is the target radio node id, for example "!6e000001": a "!" followed by
                                    8 hex digits. The pattern both validates the id and forbids a leading dash,
                                    so the value cannot be misread as a CLI flag when it reaches argv.
                                  pattern: ^![0-9a-fA-F]{8}$
                                  type: string
                                gatewayRef:
                                  description: gatewayRef names another MeshtasticNode
                                    that carries the admin channel.
                                  properties:
                                    name:
                                      default: ""
                                      description: |-
                                        Name of the referent.
                                        This field is effectively required, but due to backwards compatibility is
                                        allowed to be empty. Instances of this type with an empty value here are
                                        almost certainly wrong.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                  type: object
                                  x-kubernetes-map-type: atomic
                              required:
                              - dest
                              - gatewayRef
                              type: object
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of tcp, serial, or viaGateway must
                              be set
                            rule: '[has(self.tcp), has(self.serial), has(self.viaGateway)].filter(x,
                              x).size() == 1'
                        deletionPolicy:
                          default: Retain
                          description: |-
                            deletionPolicy decides what happens to the physical radio when this
                            resource is deleted. Retain (default) stops managing it and leaves it
                            running with its last-applied config. Wipe factory-resets it during
                            finalization.
                          enum:
                          - Retain
                          - Wipe
                          type: string
                        modemPreset:
                          description: modemPreset maps to lora.modem_preset (for
                            example LONG_FAST, MEDIUM_SLOW).
                          maxLength: 32
                          pattern: ^[A-Z0-9_]+$
                          type: string
                        mqtt:
                          description: mqtt configures the device MQTT module.
                          properties:
                            address:
                              description: address is the broker host.
                              maxLength: 253
                              type: string
                            enabled:
                              description: enabled turns the MQTT module on.
                              type: boolean
                            encryptionEnabled:
                              description: encryptionEnabled keeps payloads channel-encrypted
                                over MQTT.
                              type: boolean
                            jsonEnabled:
                              description: jsonEnabled publishes lossy JSON topics
                                (unsupported on nRF52 devices).
                              type: boolean
                            passwordSecretRef:
                              description: passwordSecretRef references the broker
                                password. It is never inlined.
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
