---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: meshtasticnodes.mesh.nephmesh.io
spec:
  group: mesh.nephmesh.io
  names:
    categories:
    - nephmesh
    kind: MeshtasticNode
    listKind: MeshtasticNodeList
    plural: meshtasticnodes
    singular: meshtasticnode
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.modemPreset
      name: Preset
      type: string
    - jsonPath: .status.nodeID
      name: NodeID
      type: string
    - jsonPath: .status.lastHeard
      name: LastHeard
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MeshtasticNode is the declared desired state of one Meshtastic
          node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MeshtasticNodeSpec is the desired state of one Meshtastic node.

              Fields mirror the real device configuration surface reachable over the
              TCP 4403 client API. Enum-like fields (region, modemPreset, role) are open
              strings with a shape pattern rather than closed enums, so a firmware update
              that adds a value does not reject the API until the CRD is re-released; the
              controller keeps known values as constants and degrades gracefully on
              anything it does not recognize.
            properties:
              channels:
                description: |-
                  channels is the desired channel set, by index. PSKs are referenced from
                  Secrets, never inlined.
                items:
                  description: ChannelSpec is one Meshtastic channel.
                  properties:
                    downlinkEnabled:
                      description: downlinkEnabled injects MQTT traffic onto this
                        channel.
                      type: boolean
                    index:
                      description: index is the channel slot; 0 is the primary channel.
                      format: int32
                      maximum: 7
                      minimum: 0
                      type: integer
                    name:
                      description: |-
                        name is the channel name. The device stores a short name (about 12 bytes)
                        and silently truncates a longer one, which would then never round-trip and
                        leave the node stuck re-applying, so it is bounded here to fail fast at
                        admission instead.
                      maxLength: 12
                      type: string
                    pskSecretRef:
                      description: |-
                        pskSecretRef references the channel pre-shared key. It is never inlined.
                        Omitting it uses the device default, which is discouraged because the
                        default PSK is public.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    uplinkEnabled:
                      description: uplinkEnabled forwards this channel's traffic to
                        MQTT.
                      type: boolean
                  required:
                  - index
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - index
                x-kubernetes-list-type: map
              connection:
                description: connection selects exactly one transport to the device.
                properties:
                  serial:
                    description: serial reaches the device over a serial port exposed
                      to the pod.
                    properties:
                      device:
                        description: |-
                          device is the serial device path, for example /dev/ttyUSB0 or COM3. The
                          pattern forbids a leading dash so the value cannot be misread as a CLI flag
                          when it reaches the device client's argv (the same guard host carries).
                        maxLength: 255
                        pattern: ^[a-zA-Z0-9/][a-zA-Z0-9/._-]*$
                        type: string
                    required:
                    - device
                    type: object
                  tcp:
                    description: tcp reaches the device over its TCP client API (port
                      4403 by default).
                    properties:
                      host:
                        description: |-
                          host is a hostname, IPv4 address, or IPv6 address. Port is a separate
                          field: an IPv4 host:port in this field is rejected so JoinHostPort cannot
                          produce a doubled port. IPv6 must contain a colon. A leading dash is
                          forbidden so the value cannot be misread as a CLI flag.
                        maxLength: 253
                        pattern: ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$|^[0-9a-fA-F:]*:[0-9a-fA-F:]+$
                        type: string
                      port:
                        default: 4403
                        description: port defaults to 4403.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - host
                    type: object
                  viaGateway:
                    description: |-
                      viaGateway manages a radio-only node remotely through a managed gateway
                      node, using the admin channel.
                    properties:
                      dest:
                        description: |-
                          dest is the target radio node id, for example "!6e000001": a "!" followed by
                          8 hex digits. The pattern both validates the id and forbids a leading dash,
                          so the value cannot be misread as a CLI flag when it reaches argv.
                        pattern: ^![0-9a-fA-F]{8}$
                        type: string
                      gatewayRef:
                        description: gatewayRef names another MeshtasticNode that
                          carries the admin channel.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    required:
                    - dest
                    - gatewayRef
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of tcp, serial, or viaGateway must be set
                  rule: '[has(self.tcp), has(self.serial), has(self.viaGateway)].filter(x,
                    x).size() == 1'
              deletionPolicy:
                default: Retain
                description: |-
                  deletionPolicy decides what happens to the physical radio when this
                  resource is deleted. Retain (default) stops managing it and leaves it
                  running with its last-applied config. Wipe factory-resets it during
                  finalization.
                enum:
                - Retain
                - Wipe
                type: string
              modemPreset:
                description: modemPreset maps to lora.modem_preset (for example LONG_FAST,
                  MEDIUM_SLOW).
                maxLength: 32
                pattern: ^[A-Z0-9_]+$
                type: string
              mqtt:
                description: mqtt configures the device MQTT module.
                properties:
                  address:
                    description: address is the broker host.
                    maxLength: 253
                    type: string
                  enabled:
                    description: enabled turns the MQTT module on.
                    type: boolean
                  encryptionEnabled:
                    description: encryptionEnabled keeps payloads channel-encrypted
                      over MQTT.
                    type: boolean
                  jsonEnabled:
                    description: jsonEnabled publishes lossy JSON topics (unsupported
                      on nRF52 devices).
                    type: boolean
                  passwordSecretRef:
                    description: passwordSecretRef references the broker password.
                      It is never inlined.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  root:
                    description: root overrides the MQTT root topic.
                    maxLength: 64
                    type: string
                  tlsEnabled:
                    description: tlsEnabled uses TLS to the broker.
                    type: boolean
                  username:
                    description: username is the broker username.
                    maxLength: 64
                    type: string
                required:
                - enabled
                type: object
              owner:
                description: owner sets the node's short and long names.
                properties:
                  longName:
                    description: longName is the full node name.
                    maxLength: 40
                    type: string
                  shortName:
                    description: shortName is limited to a few characters on the device.
                    maxLength: 4
                    type: string
                type: object
              region:
                description: region maps to lora.region (for example US, EU_868).
                  Required.
                maxLength: 32
                pattern: ^[A-Z0-9_]+$
                type: string
              role:
                description: role maps to device.role (for example CLIENT, ROUTER,
                  REPEATER).
                maxLength: 32
                pattern: ^[A-Z0-9_]+$
                type: string
            required:
            - connection
            - region
            type: object
          status:
            description: MeshtasticNodeStatus is the observed state of a Meshtastic
              node.
            properties:
              applyAttempts:
                description: |-
                  applyAttempts counts consecutive config applies that have not yet
                  converged. It resets to zero on convergence and bounds the reboot loop:
                  after too many attempts the node is marked Degraded rather than rebooting
                  forever, which protects against a desired field the device never echoes.
                format: int32
                type: integer
              conditions:
                description: |-
                  conditions follow the standard Kubernetes convention. Reachability and
                  sync state live here rather than in duplicate boolean fields.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastAppliedMQTTPasswordHash:
                description: |-
                  lastAppliedMQTTPasswordHash is the SHA-256 hex of the broker password last
                  written to the device. The device never echoes the password, so this is
                  how a Secret-only rotation is detected. It is a hash, not the password.
                type: string
              lastBoundSecretsHash:
                description: |-
                  lastBoundSecretsHash is a fingerprint of the resolved Secret-backed
                  desired state (MQTT password and channel PSKs) last evaluated. Secret
                  data is not part of metadata.generation, so this is how a Secret-only
                  change resets the apply bound on a Degraded node. It is a hash, not
                  secret material.
                type: string
              lastHeard:
                description: lastHeard is when the device was last reachable.
                format: date-time
                type: string
              nodeID:
                description: nodeID is the device node id, for example "!6e000001".
                type: string
              observedGeneration:
                description: observedGeneration is the generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
