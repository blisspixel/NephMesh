# The operator itself. The image bundles the pinned Meshtastic CLI it execs
# (see operators/meshtastic-operator/Dockerfile) and runs as a non-root user
# with escalation disabled and all capabilities dropped. The image tag is a
# placeholder until a release publishes it; it must be available to the target
# cluster (a release pushes it to ghcr.io with a digest).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshtastic-operator
  labels:
    app.kubernetes.io/name: meshtastic-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meshtastic-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meshtastic-operator
    spec:
      serviceAccountName: meshtastic-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/blisspixel/nephmesh-meshtastic-operator:v0.4.0
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The CLI Apply writes a short-lived config file under TMPDIR; a
          # writable emptyDir keeps the root filesystem read-only so a
          # compromised process cannot rewrite the binary or the bundled CLI.
          env:
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
