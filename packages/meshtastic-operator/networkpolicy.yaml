# Egress bounds for the operator. Its device connection host comes from a
# custom resource, so without a policy a crafted MeshtasticNode could point the
# operator at arbitrary in-cluster addresses and use its reachability status as
# a port-scan oracle. This restricts the operator to DNS, the Kubernetes API
# (which it needs), and the device API port (4403) inside the cluster; it does
# not, and cannot, validate that 4403 targets are genuine devices, so the host
# field also carries a shape pattern in the CRD. Requires a policy-enforcing
# CNI. Tune the API-server rule to your cluster if the control plane is off the
# in-cluster CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meshtastic-operator-egress
  labels:
    app.kubernetes.io/name: meshtastic-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meshtastic-operator
  policyTypes: [Egress]
  egress:
    # DNS.
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Device API (Meshtastic TCP client API) inside the cluster only.
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 4403}
    # Kubernetes API server. 443 covers the common in-cluster kubernetes
    # Service; adjust for a control plane reached on another port or address.
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
