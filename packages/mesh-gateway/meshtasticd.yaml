# Namespace is intentionally omitted: set-namespace applies the per-site
# namespace at render time. See demo/phase1 for the validated behavior these
# resources are drawn from (persistence at --fsdir, deterministic --hwid,
# the process exits on config apply and is restarted by the Deployment).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meshnode-portduino
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshnode-sim
  labels:
    app.kubernetes.io/name: meshnode-sim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meshnode-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meshnode-sim
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meshtasticd
          image: meshtastic/meshtasticd:beta-debian
          command: ["meshtasticd"]
          args:
            - --sim
            - --fsdir=/var/lib/meshtasticd
            - --hwid=dc2c6e000001
            - --port=4403
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: device-api
              containerPort: 4403
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: portduino
              mountPath: /var/lib/meshtasticd
      volumes:
        - name: portduino
          persistentVolumeClaim:
            claimName: meshnode-portduino
---
apiVersion: v1
kind: Service
metadata:
  name: meshnode-sim
  labels:
    app.kubernetes.io/name: meshnode-sim
spec:
  selector:
    app.kubernetes.io/name: meshnode-sim
  ports:
    - name: device-api
      port: 4403
      targetPort: device-api
