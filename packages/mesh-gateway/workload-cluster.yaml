# Placeholder WorkloadCluster, following the Nephio pkg-example-*-bp pattern.
# A PackageVariant/PackageVariantSet injects the real per-site WorkloadCluster
# here (by name), giving future specializer functions the site context they
# need. It is marked local-config so that, when rendered standalone without
# injection, it is treated as render-time context and never applied to a
# cluster. No specializer consumes it yet; this records the injection point
# for Phase 5.
apiVersion: infra.nephio.org/v1alpha1
kind: WorkloadCluster
metadata:
  name: example
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  clusterName: example
  cnis:
    - macvlan
