# Desired node state (Meshtastic --export-config / --configure YAML) plus the
# declarative applier. Service names are short and namespace-relative, so the
# gateway resolves its broker within whatever namespace set-namespace places
# the package into. Channel PSKs are never carried here; the demo uses only
# the default channel and no secret material (see docs/security).
apiVersion: v1
kind: ConfigMap
metadata:
  name: meshnode-desired-state
data:
  node.yaml: |
    config:
      lora:
        region: US
    module_config:
      mqtt:
        enabled: true
        address: __MQTT_ADDRESS__
        json_enabled: true
  apply.py: |
    # Copyright 2026 The NephMesh Authors.
    # Licensed under the Apache License, Version 2.0. See the repository
    # LICENSE file; header abbreviated here to keep the ConfigMap readable.
    #
    # Declarative config applier: export live state, compare the desired
    # subset, apply only on drift, verify after the device reboots. This
    # one-shot Job is the seed of the Phase 4 operator loop.
    import os
    import socket
    import subprocess
    import sys
    import time

    import yaml

    HOST = os.environ["MESH_HOST"]
    MQTT_SERVICE = os.environ["MQTT_SERVICE"]

    def wait_reachable(timeout=180):
        deadline = time.time() + timeout
        while time.time() < deadline:
            try:
                with socket.create_connection((HOST, 4403), timeout=5):
                    return
            except OSError:
                time.sleep(3)
        sys.exit(f"device API {HOST}:4403 not reachable in {timeout}s")

    def cli(*args, tolerate_failure=False):
        cmd = ["meshtastic", "--host", HOST, *args]
        proc = subprocess.run(cmd, capture_output=True, text=True, timeout=180)
        if proc.returncode != 0 and not tolerate_failure:
            sys.exit(f"{' '.join(cmd)} failed:\n{proc.stdout}\n{proc.stderr}")
        return proc.stdout

    def export_live():
        out = cli("--export-config")
        start = out.find("# start of Meshtastic configure yaml")
        return yaml.safe_load(out[start:] if start >= 0 else out)

    def norm_key(k):
        # The CLI accepts snake_case on --configure but exports camelCase, so
        # keys compare case- and underscore-insensitively.
        return str(k).lower().replace("_", "")

    def is_subset(desired, live):
        if isinstance(desired, dict):
            if not isinstance(live, dict):
                return False
            live_n = {norm_key(k): v for k, v in live.items()}
            return all(
                norm_key(k) in live_n and is_subset(v, live_n[norm_key(k)])
                for k, v in desired.items()
            )
        return str(desired).strip().lower() == str(live).strip().lower()

    def main():
        broker_ip = socket.gethostbyname(MQTT_SERVICE)
        with open("/config/node.yaml") as f:
            desired = yaml.safe_load(f.read().replace("__MQTT_ADDRESS__", broker_ip))

        wait_reachable()
        if is_subset(desired, export_live() or {}):
            print("already converged; no changes, no reboot")
            return

        rendered = os.path.join(os.environ.get("HOME", "/tmp"), "node-rendered.yaml")
        with open(rendered, "w") as f:
            yaml.safe_dump(desired, f)

        # The CLI may lose its session mid-apply if the device restarts, so
        # failures here are tolerated and judged by the post-reboot verify.
        print("applying configuration")
        cli("--configure", rendered, tolerate_failure=True)
        time.sleep(10)
        wait_reachable()
        print("enabling MQTT uplink on the primary channel")
        cli("--ch-set", "uplink_enabled", "true", "--ch-index", "0",
            tolerate_failure=True)
        time.sleep(10)
        wait_reachable()
        # The MQTT client thread starts only at boot; an explicit reboot makes
        # the outcome deterministic.
        print("rebooting device to activate module config")
        cli("--reboot", tolerate_failure=True)
        time.sleep(15)
        wait_reachable()

        if is_subset(desired, export_live() or {}):
            print("configuration verified after apply")
        else:
            sys.exit("post-apply verification failed: live config does not match desired state")

    if __name__ == "__main__":
        main()
