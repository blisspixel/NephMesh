# Tells the Prometheus Operator to scrape the exporter's Service. This is the
# "wire into Prometheus" step: with the operator installed (kube-prometheus-stack
# or bare prometheus-operator), the sensed-spectrum gauges land in Prometheus
# alongside the operator's own metrics.
#
# Two knobs make Prometheus actually select this, both install-specific:
#   - The `release` label must match your Prometheus's serviceMonitorSelector
#     (kube-prometheus-stack defaults to selecting release: <helm release name>).
#     Adjust it, or drop it if your Prometheus selects all ServiceMonitors.
#   - Prometheus must be allowed to discover this namespace (its
#     serviceMonitorNamespaceSelector, or serviceMonitorSelectorNilUsesHelmValues).
#
# Requires the monitoring.coreos.com CRDs (Prometheus Operator). It is additive:
# a cluster without the operator simply ignores this resource.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spectrum-exporter
  # A placeholder namespace so set-namespace rewrites it to the per-clone
  # namespace (the mutator only touches custom resources that already carry one).
  namespace: nephmesh-placeholder
  labels:
    app.kubernetes.io/name: spectrum-exporter
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spectrum-exporter
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
